<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>員工薪資系統 - 查詢薪資</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="login-container">
        <h1>查詢薪資</h1>
        <p>請輸入員工編號 (例如 F001, P001, I001...):</p>
        <form action="/check_salary" method="POST">
            <label>員工編號：</label>
            <input type="text" name="employee_id" placeholder="例: F001" required>
            <button type="submit">查詢</button>
        </form>
        <p><a href="/">回首頁</a></p>
    </div>

</body>

</html>
